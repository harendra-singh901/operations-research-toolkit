[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "operations-research-toolkit"
version = "1.0.0"
description = "Graduate-level operations research and industrial logistics optimization toolkit"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.12", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]
